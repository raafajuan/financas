  },
  remoteRender: U.debounce(() => {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#main') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { if (view === 'moves') refreshMoves(); Cloud.deferred = true; return; }
    Cloud.deferred = false; render();
  }, 250),
  async start() {
    Cloud.on = true;
    Cloud.client = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'financas-rt-auth' } });
    let session = null;
    try { const { data } = await Cloud.client.auth.getSession(); session = data && data.session; } catch (e) {}
    if (session && session.user) await Cloud.login(session.user); else showLogin();
    window.addEventListener('online', () => { Cloud.error = ''; Cloud.pull().then(() => Cloud.push()); });
    window.addEventListener('offline', () => Cloud.paintStatus());
    setInterval(() => { if (Cloud.user && !document.hidden) { Cloud.pull().then(() => Cloud.push()); } }, 60000);
    document.getElementById('main').addEventListener('focusout', () => setTimeout(() => { if (Cloud.deferred) Cloud.remoteRender(); }, 50));
  },
  async login(user) {
    const name = nameForEmail(user.email) || (D.people && D.people[user.id]);
    if (!name && EMAILS_SET) { try { await Cloud.client.auth.signOut(); } catch (e) {} showLogin('Este e-mail não está autorizado. Confira o config.js.'); return; }
    if (!name) { pickPerson(user); return; }
    Cloud.user = user; Cloud.email = user.email; D.currentUser = name; saveDevice();
    if (!Cloud.loadCache()) {
      // primeira vez nesta conta neste aparelho: aproveita o que já existia no modo local
      S = migrate(Store.read(DATA_KEY)); Cloud.known = new Map(); Cloud.pending = {}; Cloud.cursor = null; Cloud.everSynced = false;
    }
    Cloud.loginShown = false; document.getElementById('overlay').innerHTML = '';
    render();
    if (D.pin) showLock();
    try { Cloud.client.channel('docs-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, () => Cloud.schedulePull(300)).subscribe(); } catch (e) {}
    await Cloud.pull(); await Cloud.push();
  },
  async logout() {
    try { await Cloud.client.auth.signOut(); } catch (e) {}
    try { localStorage.removeItem(Cloud.key()); } catch (e) {}
    location.reload();
  }
};

function showLogin(msg = '') {
  Cloud.loginShown = true;
  document.getElementById('overlay').innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Entrar"><form class="overlay-inner" id="login-form" novalidate>
    <h1>Finanças</h1>
    <p class="muted" style="margin:0">Entre para ver e registrar as finanças do casal.</p>
    <label class="f" style="text-align:left">E-mail<input class="input" id="lg-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
    <label class="f" style="text-align:left">Senha<input class="input" id="lg-pass" type="password" autocomplete="current-password"></label>
    <div id="lg-err">${msg ? `<div class="form-error" role="alert">${U.esc(msg)}</div>` : ''}</div>
    <button class="btn btn-primary btn-block" type="submit" id="lg-btn">Entrar</button>
    <p class="small muted" style="margin:0">Não há cadastro público. As contas de Rafael e Thayná são criadas no painel do Supabase.</p>
  </form></div>`;
}
async function doLogin() {
  const w = document.getElementById('login-form'); if (!w) return;
  const email = w.querySelector('#lg-email').value.trim(), pass = w.querySelector('#lg-pass').value;
  const btn = w.querySelector('#lg-btn');
  const show = m => { w.querySelector('#lg-err').innerHTML = `<div class="form-error" role="alert">${U.esc(m)}</div>`; };
  if (!email || !pass) return show('Informe o e-mail e a senha.');
  if (EMAILS_SET && !nameForEmail(email)) return show('Este e-mail não está na lista do app (config.js).');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const { data, error } = await Cloud.client.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    await Cloud.login(data.user);
  } catch (e) { show(Cloud.msg(e)); btn.disabled = false; btn.textContent = 'Entrar'; }
}
document.addEventListener('submit', e => { if (e.target && e.target.id === 'login-form') { e.preventDefault(); doLogin(); } });
let pendingUser = null;
function pickPerson(user) {
  pendingUser = user; Cloud.loginShown = false;
  document.getElementById('overlay').innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Quem é você"><div class="overlay-inner">
    <h1>Quem é você?</h1>
    <p class="muted" style="margin:0">Conectado como ${U.esc(user.email)}. Os seus lançamentos vão sair com este nome. A pergunta aparece só uma vez neste aparelho.</p>
    <div class="who-pick">${USERS.map(u => `<button data-act="cloud-pick" data-v="${u}"><span class="avatar av-${U.userKey(u)}">${u[0]}</span>${u}</button>`).join('')}</div>
  </div></div>`;
}
function showSetup() {
  document.getElementById('overlay').innerHTML = `<div class="overlay"><div class="overlay-inner" style="text-align:left">
    <h1>Falta configurar</h1>
    <p style="margin:0">${window.supabase ? 'O arquivo <b>config.js</b> ainda está com os valores de exemplo.' : 'A biblioteca do Supabase (js/supabase.js) não carregou. Confira se a pasta js foi enviada completa.'}</p>
    <p class="muted" style="margin:0">Abra o config.js no GitHub, cole a URL e a chave do projeto Supabase e os e-mails de Rafael e Thayná, salve e recarregue esta página.</p>
  </div></div>`;
}

/* =========================================================
   INICIALIZAÇÃO + PWA
   ========================================================= */
function initPWA() {
  const standaloneHost = window.self === window.top && /^https?:$/.test(location.protocol);
  if (!standaloneHost) return;
  const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  link('manifest', 'manifest.json'); link('apple-touch-icon', 'icons/icon-192.png'); link('icon', 'icons/icon-192.png');
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
function init() {
  applyTheme();
  storageOK = storageProbe();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  initPWA();
  if (CFG) {
    if (CFG_INCOMPLETE || !window.supabase) { showSetup(); return; }
    Cloud.start();
    return;
  }
  Rec.generate();
  if (!Store.read(DATA_KEY)) persist();
  render();
  if (D.pin) showLock(); else checkWelcome();
}

// API interna exposta para testes e depuração
window.FinApp = { get S() { return S; }, get D() { return D; }, Cloud, U, Tx, Cat, Rec, Calc, Budget, Period, range, filterTx, searchTx, mergeData, exportJSON, exportCSV, parseBackup, render, go, setPreset, shiftPeriod, persist };
init();
})();
