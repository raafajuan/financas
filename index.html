<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C44B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Finanças de Rafael e Thayná</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#17202D; --ink-2:#556174; --ink-3:#8A93A3; --line:#DDE2EA;
  --brand:#2C44B8; --brand-soft:#E5E9FA; --on-brand:#FFFFFF;
  --in:#0E7A57; --in-soft:#E1F3EA; --out:#C0344A; --out-soft:#FBE7EA; --warn:#935C00; --warn-soft:#FBEFD3;
  --rafael:#2C44B8; --thayna:#93409E;
  --shadow:0 1px 2px rgba(23,32,45,.05),0 10px 30px rgba(23,32,45,.07);
  --r-xl:26px; --r-lg:18px; --r-md:13px;
  --nav-h:66px;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-num:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1219; --surface:#171D27; --surface-2:#1E2532; --ink:#E8ECF3; --ink-2:#A6B0C0; --ink-3:#7A8496; --line:#2A3342;
    --brand:#5C73E6; --brand-soft:#232C4A; --on-brand:#FFFFFF;
    --in:#3DC291; --in-soft:#15302A; --out:#F07586; --out-soft:#3A1D25; --warn:#E6B04C; --warn-soft:#3A2E14;
    --rafael:#7F92F0; --thayna:#D18ADB; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1219; --surface:#171D27; --surface-2:#1E2532; --ink:#E8ECF3; --ink-2:#A6B0C0; --ink-3:#7A8496; --line:#2A3342;
  --brand:#5C73E6; --brand-soft:#232C4A; --on-brand:#FFFFFF;
  --in:#3DC291; --in-soft:#15302A; --out:#F07586; --out-soft:#3A1D25; --warn:#E6B04C; --warn-soft:#3A2E14;
  --rafael:#7F92F0; --thayna:#D18ADB; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.hidden{display:none!important}
img,svg,canvas{max-width:100%}

/* ============ LAYOUT ============ */
#main{max-width:720px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 30px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.brandline{display:flex;flex-direction:column}
.brandline b{font:700 15px var(--font-num);color:var(--brand);letter-spacing:.01em}
.brandline h1{margin:0;font:700 26px/1.15 var(--font-num);letter-spacing:-.02em}
.page-title{margin:0;font:700 26px/1.15 var(--font-num);letter-spacing:-.02em}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--brand);font-weight:600;padding:8px 0;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.userpill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;min-height:44px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px var(--font-num)}
.av-rafael{background:var(--rafael)} .av-thayna{background:var(--thayna)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* ============ NAV ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
.tab{height:var(--nav-h);border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11.5px var(--font-ui);padding:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand)}
.tab-plus{display:grid;place-items:center}
.plus-btn{width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(44,68,184,.35),0 0 0 5px var(--bg)}
.plus-btn svg{width:28px;height:28px}
.sidebar{display:none}

/* ============ HERO ============ */
.hero{background:var(--brand);color:var(--on-brand);border-radius:var(--r-xl);padding:20px 20px 18px;box-shadow:var(--shadow)}
.hero-label{font-size:15px;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.hero-big{font:700 clamp(38px,11.5vw,56px)/1.02 var(--font-num);letter-spacing:-.03em;margin:6px 0 16px;font-variant-numeric:tabular-nums;word-break:break-word}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.meter.over i{background:#FFB4BF}
.hero-note{font-size:14px;margin-top:8px;opacity:.92}

.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:14px 16px;border-top:1px solid var(--line)}
.stat:nth-child(-n+2){border-top:0}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat span{display:block;font-size:13.5px;color:var(--ink-2)}
.stat strong{display:block;font:700 20px/1.2 var(--font-num);font-variant-numeric:tabular-nums;margin-top:2px}
.pos{color:var(--in)} .neg{color:var(--out)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-in,.btn-out{min-height:56px;border-radius:var(--r-md);border:0;font:700 17px var(--font-ui);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-in{background:var(--in-soft);color:var(--in)} .btn-out{background:var(--out-soft);color:var(--out)}

/* ============ PERIOD ============ */
.period{display:flex;flex-direction:column;gap:8px}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.monthnav button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav strong{font:700 17px var(--font-num)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--font-ui);white-space:nowrap;flex:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ============ PANELS ============ */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.panel h2,.section-h{margin:0 0 10px;font:700 19px/1.2 var(--font-num);letter-spacing:-.01em}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.panel-head h2{margin:0}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:8px 0;min-height:40px}
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.insights li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.insights li i{font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;flex:none;font-size:15px}
.insights li.warn i{background:var(--warn-soft)}
.empty{text-align:center;padding:26px 12px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font:700 18px var(--font-num);margin-bottom:6px}
.note{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;color:var(--ink-3);padding:6px 0}

/* category bars */
.catline{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border:0;background:none;width:100%;text-align:left}
.catline + .catline{border-top:1px solid var(--line)}
.cat-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:17px}
.catline .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.catline .nm small{color:var(--ink-3);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.near i{background:var(--warn)} .bar.over i{background:var(--out)}
.catline .val{font:700 16px var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.subs{padding:4px 0 10px 44px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.subs div{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}

/* ============ TRANSACTIONS ============ */
.txlist{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-weight:700;font-size:14px;color:var(--ink-2)}
.dayhead span:last-child{font-variant-numeric:tabular-nums}
.tx{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border:0;background:var(--surface);text-align:left;width:100%;min-height:62px}
.txgroup{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.txgroup .tx + .tx{border-top:1px solid var(--line)}
.tx:hover{background:var(--surface-2)}
.tx.is-future{opacity:.72}
.tx-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px}
.tx-ic.income{background:var(--in-soft)} .tx-ic.expense{background:var(--surface-2)}
.tx-main{min-width:0}
.tx-desc{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ink-2);margin-top:1px}
.who{font-weight:700}
.who-rafael{color:var(--rafael)} .who-thayna{color:var(--thayna)}
.tag{font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:0 6px}
.tx-amt{font:700 16px var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.income{color:var(--in)} .tx-amt.expense{color:var(--ink)}

/* ============ SEARCH / FILTERS ============ */
.search{position:relative}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters .full{grid-column:1/-1}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;margin-left:6px}
.totals{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);padding:2px}
.totals b{font-variant-numeric:tabular-nums}

/* ============ FORMS ============ */
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2)}
.input,select.input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px;background:var(--surface-2);color:var(--ink);font:500 16px var(--font-ui);appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type="date"].input,input[type="time"].input{min-width:0}
.amount-box{border-radius:var(--r-lg);padding:14px 16px;background:var(--surface-2)}
.amount-box.expense{background:var(--out-soft)} .amount-box.income{background:var(--in-soft)}
.amount-row{display:flex;align-items:baseline;gap:8px}
.amount-row span{font:700 26px var(--font-num);color:var(--ink-2)}
.amount-row input{border:0;background:transparent;font:700 44px/1.1 var(--font-num);width:100%;min-width:0;padding:0;color:var(--ink);font-variant-numeric:tabular-nums}
.amount-row input:focus{outline:none}
.amount-hint{font-size:14px;color:var(--ink-2);min-height:20px;margin-top:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.type button[data-v="income"][aria-pressed="true"]{color:var(--in)}
.seg.type button[data-v="expense"][aria-pressed="true"]{color:var(--out)}
.fl{font-size:14px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cat{min-height:74px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font:600 13px/1.2 var(--font-ui);text-align:center;color:var(--ink)}
.cat .e{font-size:22px;line-height:1}
.cat[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.cat.add{border-style:dashed;color:var(--brand)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset .chip{min-height:44px}
.chipset .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.add{border-style:dashed;color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-error{color:var(--out);background:var(--out-soft);border-radius:var(--r-md);padding:12px 14px;font-weight:600}
.info{background:var(--brand-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--brand)}

.btn{min-height:50px;border-radius:var(--r-md);border:1px solid transparent;padding:0 18px;font:700 16px var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-danger{background:var(--out-soft);color:var(--out)}
.btn-block{width:100%}
.btn-col{display:flex;flex-direction:column;gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ============ SHEETS ============ */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(8,12,20,.5);animation:fade .18s ease-out}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 8px 18px}
.sheet-head h2{margin:0;font:700 20px var(--font-num)}
.sheet-body{overflow:auto;padding:4px 16px 18px;flex:1;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:12px 16px 14px;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{min-height:120px;border-radius:20px;border:0;font:700 22px var(--font-num);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.choice button small{font:500 14px var(--font-ui);opacity:.8}
.choice .c-in{background:var(--in-soft);color:var(--in)} .choice .c-out{background:var(--out-soft);color:var(--out)}
.detail-amt{font:700 40px/1.1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}
.dl dt{color:var(--ink-2);font-size:14.5px}
.dl dd{margin:0;font-weight:600;text-align:right;word-break:break-word}

/* ============ TOAST ============ */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ OVERLAYS ============ */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.overlay-inner{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px;text-align:center}
.overlay h1{margin:0;font:700 32px/1.1 var(--font-num);letter-spacing:-.02em}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-pick button{min-height:140px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:700 19px var(--font-num);box-shadow:var(--shadow)}
.who-pick .avatar{width:56px;height:56px;font-size:24px}
.pin-dots{display:flex;justify-content:center;gap:14px;min-height:20px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3)}
.pin-dots i.on{background:var(--brand);border-color:var(--brand)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto;width:100%}
.keypad button{height:70px;border-radius:50%;border:0;background:var(--surface);font:600 26px var(--font-num);box-shadow:var(--shadow);width:70px;justify-self:center}
.keypad button.ghost{background:transparent;box-shadow:none;font-size:15px;color:var(--ink-2)}

/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;font-weight:700;color:var(--ink-3);text-align:center;padding:4px 0}
.cal .d{min-height:66px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:5px 4px;display:flex;flex-direction:column;align-items:stretch;gap:1px;font-size:10.5px;line-height:1.2;text-align:right;font-variant-numeric:tabular-nums;overflow:hidden}
.cal .d b{font:700 13px var(--font-num);text-align:left;color:var(--ink)}

<noscript><p style="padding:20px">Ative o JavaScript para usar o aplicativo.</p></noscript>

<script>
(function () {
'use strict';

/* =========================================================
   CONSTANTES
   ========================================================= */
const APP_ID = 'financas-rafael-thayna';
const DATA_KEY = 'financas-rt:data:v1';     // dados compartilháveis (vão no backup)
const DEVICE_KEY = 'financas-rt:device:v1'; // preferências deste aparelho (pessoa, tema, PIN)
const USERS = ['Rafael', 'Thayná'];
const INCOME_METHODS = ['Pix', 'Dinheiro', 'Transferência', 'Cartão', 'Débito', 'Outros'];
const EXPENSE_METHODS = ['Pix', 'Dinheiro', 'Débito', 'Crédito', 'Boleto', 'Transferência', 'Outros'];
const FREQS = { none: 'Não se repete', daily: 'Diariamente', weekly: 'Semanalmente', monthly: 'Mensalmente', yearly: 'Anualmente' };
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_S = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const CAT_COLORS = ['#2C44B8','#0E7A57','#C0344A','#D08A1E','#93409E','#1F8FA6','#6B7A2E','#D1557A','#5A6CE0','#8C5A3C','#3AA17E','#7D8799','#B5542B','#4B5D8C'];

const DEFAULT_EXPENSE = [
  ['Moradia','🏠',['Aluguel','Condomínio','Água','Luz','Gás','Internet','Manutenção da casa','IPTU']],
  ['Alimentação','🍽️',['Supermercado','Restaurante','Delivery','Padaria','Lanches','Alimentação fora de casa']],
  ['Transporte','🚗',['Combustível','Uber','Estacionamento','Manutenção do carro','Seguro','IPVA','Transporte público']],
  ['Saúde','💊',['Farmácia','Médico','Dentista','Exames','Plano de saúde']],
  ['Lazer','🎬',['Cinema','Passeios','Viagens','Jogos','Hobbies','Restaurantes','Entretenimento']],
  ['Assinaturas','📺',['Netflix','Spotify','Prime Video','Disney+','HBO Max','YouTube Premium','Outros streamings']],
  ['Educação','📚',['Cursos','Livros','Faculdade','Material escolar']],
  ['Academia e esportes','🏋️',['Academia','Suplementos','Equipamentos','Esportes']],
  ['Compras','🛍️',['Roupas','Calçados','Eletrônicos','Casa','Presentes','Outros']],
  ['Filhos','🧸',['Fraldas','Roupas','Brinquedos','Escola','Alimentação','Saúde','Passeios','Outros']],
  ['Financeiro','🏦',['Juros','Tarifas bancárias','Empréstimos','Financiamentos','Cartão de crédito','Outros']],
  ['Outros','📦',[]]
];
const DEFAULT_INCOME = [
  ['Salário','💼'],['Vale alimentação','🧾'],['Vale presente','🎁'],['Renda extra','✨'],['Freelance','💻'],
  ['Pix recebido','⚡'],['Reembolso','↩️'],['Venda','🏷️'],['Investimentos','📈'],['Outros','📦']
];

/* =========================================================
   UTILS
   ========================================================= */
const moneyFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const plainFmt = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const U = {
  uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  },
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); },
  norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); },
  round2(v) { return Math.round((Number(v) + Number.EPSILON) * 100) / 100; },
  money(v) { return moneyFmt.format(U.round2(v || 0)); },
  plain(v) { return plainFmt.format(U.round2(v || 0)); },
  signed(v, type) { return (type === 'income' ? '+' : '−') + U.money(Math.abs(v)); },
  /** Aceita "10", "10,50", "1.250,50", "1250.5", "R$ 1.250". Retorna NaN se inválido, negativo se começar com "-". */
  parseAmount(input) {
    let s = String(input ?? '').replace(/\s|R\$/gi, '');
    if (!s) return NaN;
    let neg = false;
    if (s.startsWith('-') || s.startsWith('−')) { neg = true; s = s.slice(1); }
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
    const v = U.round2(parseFloat(s));
    return neg ? -v : v;
  },
  pad(n) { return String(n).padStart(2, '0'); },
  iso(d) { return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()); },
  parse(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); },
  today() { return U.iso(new Date()); },
  nowTime() { const d = new Date(); return U.pad(d.getHours()) + ':' + U.pad(d.getMinutes()); },
  addDays(iso, n) { const d = U.parse(iso); d.setDate(d.getDate() + n); return U.iso(d); },
  addMonths(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    const t = new Date(y, m - 1 + n, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(d, last));
    return U.iso(t);
  },
  lastDay(y, m) { return new Date(y, m + 1, 0).getDate(); },
  br(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; },
  short(iso) { if (!iso) return ''; const [, m, d] = iso.split('-'); return d + '/' + m; },
  dayLabel(iso) {
    const t = U.today();
    if (iso === t) return 'Hoje';
    if (iso === U.addDays(t, -1)) return 'Ontem';
    if (iso === U.addDays(t, 1)) return 'Amanhã';
    return WEEK[U.parse(iso).getDay()] + ', ' + U.short(iso) + (iso.slice(0, 4) !== t.slice(0, 4) ? '/' + iso.slice(0, 4) : '');
  },
  userKey(u) { return U.norm(u) === 'thayna' ? 'thayna' : 'rafael'; },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  nowISO() { return new Date().toISOString(); }
};

/* =========================================================
   ARMAZENAMENTO (storage.js)
   ========================================================= */
let storageOK = true;
const Store = {
  read(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { storageOK = false; return null; }
  },
  write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); storageOK = true; return true; }
    catch (e) { storageOK = false; toast('Não foi possível salvar neste navegador. Faça um backup agora.'); return false; }
  }
};

function defaultData() {
  return {
    app: APP_ID, schema: 1, updatedAt: U.nowISO(),
    categories: {
      expense: DEFAULT_EXPENSE.map(([name, icon, subs]) => ({ id: U.uid(), name, icon, subs: [...subs], customSubs: [], custom: false })),
      income: DEFAULT_INCOME.map(([name, icon]) => ({ id: U.uid(), name, icon, custom: false }))
    },
    transactions: [],
    recurrences: [],
    budgets: {},          // { "Alimentação": 1500 }
    monthlyBudget: 0,
    budgetsUpdatedAt: null,
    deleted: {}           // lápides { id: dataExclusão } para sincronização manual entre aparelhos
  };
}
function defaultDevice() {
  return { currentUser: null, theme: 'auto', pin: null, lastBackup: null, lastMethod: { income: 'Pix', expense: 'Pix' } };
}
function validTx(t) {
  return t && typeof t.id === 'string' && (t.type === 'income' || t.type === 'expense') &&
    typeof t.amount === 'number' && isFinite(t.amount) && t.amount >= 0 &&
    typeof t.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.date);
}
function migrate(d) {
  const base = defaultData();
  if (!d || typeof d !== 'object') return base;
  const out = Object.assign({}, base, d);
  const cats = d.categories || {};
  out.categories = {
    expense: Array.isArray(cats.expense) && cats.expense.length ? cats.expense.map(c => ({ id: c.id || U.uid(), name: String(c.name), icon: c.icon || '🏷️', subs: Array.isArray(c.subs) ? c.subs.map(String) : [], customSubs: Array.isArray(c.customSubs) ? c.customSubs : [], custom: !!c.custom })) : base.categories.expense,
    income: Array.isArray(cats.income) && cats.income.length ? cats.income.map(c => ({ id: c.id || U.uid(), name: String(c.name), icon: c.icon || '💰', custom: !!c.custom })) : base.categories.income
  };
  out.transactions = Array.isArray(d.transactions) ? d.transactions.filter(validTx) : [];
  out.recurrences = Array.isArray(d.recurrences) ? d.recurrences.filter(r => r && r.id && FREQS[r.frequency] && r.template) : [];
  out.budgets = d.budgets && typeof d.budgets === 'object' ? d.budgets : {};
  out.deleted = d.deleted && typeof d.deleted === 'object' ? d.deleted : {};
  out.monthlyBudget = Number(d.monthlyBudget) || 0;
  out.app = APP_ID; out.schema = 1;
  return out;
}

function storageProbe() {
  try { const k = 'financas-rt:probe', v = String(Date.now()); localStorage.setItem(k, v); const ok = localStorage.getItem(k) === v; localStorage.removeItem(k); return ok; }
  catch (e) { return false; }
}
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isHosted = () => window.self === window.top && /^https?:$/.test(location.protocol);
const inAppBrowser = /FBAN|FBAV|Instagram|WhatsApp|Line\/|Telegram|TikTok/i.test(navigator.userAgent);

let S = migrate(Store.read(DATA_KEY));
let D = Object.assign(defaultDevice(), Store.read(DEVICE_KEY) || {});
D.lastMethod = Object.assign({ income: 'Pix', expense: 'Pix' }, D.lastMethod || {});

function persist() {
  S.updatedAt = U.nowISO();
  if (Cloud.on) return Cloud.user ? Cloud.commit() : false;
  return Store.write(DATA_KEY, S);
}
function saveDevice() { return Store.write(DEVICE_KEY, D); }

/* =========================================================
   CATEGORIAS (categories.js)
   ========================================================= */
const Cat = {
  list(type) { return S.categories[type]; },
  find(type, name) { const n = U.norm(name); return S.categories[type].find(c => U.norm(c.name) === n); },
  icon(type, name) { const c = Cat.find(type, name); return c ? c.icon : (type === 'income' ? '💰' : '🏷️'); },
  add(type, rawName, icon) {
    const name = String(rawName || '').trim().replace(/\s+/g, ' ');
    if (!name) return { error: 'Informe o nome da categoria.' };
    if (name.length > 40) return { error: 'Use um nome com até 40 caracteres.' };
    if (Cat.find(type, name)) return { error: 'Já existe uma categoria com esse nome.' };
    const c = { id: U.uid(), name, icon: icon || (type === 'income' ? '💰' : '🏷️'), custom: true };
    if (type === 'expense') { c.subs = []; c.customSubs = []; }
    S.categories[type].push(c); persist();
    return { ok: c };
  },
  addSub(groupName, rawName) {
    const g = Cat.find('expense', groupName);
    const name = String(rawName || '').trim().replace(/\s+/g, ' ');
    if (!g) return { error: 'Escolha a categoria principal.' };
    if (!name) return { error: 'Informe o nome da categoria.' };
    if (g.subs.some(s => U.norm(s) === U.norm(name))) return { error: 'Essa subcategoria já existe em ' + g.name + '.' };
    g.subs.push(name); g.customSubs = [...(g.customSubs || []), name]; persist();
    return { ok: name };
  },
  remove(type, name) {
    const i = S.categories[type].findIndex(c => U.norm(c.name) === U.norm(name) && c.custom);
    if (i < 0) return false;
    S.categories[type].splice(i, 1); persist(); return true;
  },
  removeSub(groupName, sub) {
    const g = Cat.find('expense', groupName); if (!g || !(g.customSubs || []).includes(sub)) return false;
    g.subs = g.subs.filter(s => s !== sub); g.customSubs = g.customSubs.filter(s => s !== sub); persist(); return true;
  },
  usage(type, name) { return S.transactions.filter(t => t.type === type && t.category === name).length; }
};

/* =========================================================
   LANÇAMENTOS (transactions.js)
   ========================================================= */
function makeTx(d) {
  const now = U.nowISO();
  return {
    id: d.id || U.uid(),
    user: d.user,
    type: d.type,
    category: d.category,
    subcategory: d.subcategory || '',
    description: String(d.description || '').trim(),
    amount: U.round2(d.amount),
    paymentMethod: d.paymentMethod || '',
    cardName: d.cardName || '',
    date: d.date,
    time: d.time || U.nowTime(),
    createdAt: d.createdAt || now,
    updatedAt: now,
    recurring: !!d.recurrenceId,
    recurrenceId: d.recurrenceId || null,
    installment: d.installment || null,
    demo: !!d.demo
  };
}
const Tx = {
  get(id) { return S.transactions.find(t => t.id === id); },
  validate(d, raw) {
    if (raw !== undefined && String(raw).trim() === '') return 'Informe o valor da movimentação.';
    if (typeof d.amount !== 'number' || isNaN(d.amount)) return 'Informe o valor da movimentação. Exemplos: 10, 10,50 ou 1.250,50.';
    if (d.amount < 0) return 'O valor não pode ser negativo. Para dinheiro que entrou, use "Entrada".';
    if (d.amount === 0) return 'O valor precisa ser maior que zero.';
    if (d.amount > 99999999) return 'Esse valor parece alto demais. Confira os dígitos.';
    if (!d.category) return 'Escolha uma categoria.';
    if (d.type === 'expense' && !String(d.description || '').trim()) return 'Descreva o gasto para facilitar sua identificação posteriormente.';
    if (!d.date || !/^\d{4}-\d{2}-\d{2}$/.test(d.date)) return 'Informe a data.';
    if (!USERS.includes(d.user)) return 'Escolha quem fez o lançamento.';
    return null;
  },
  add(d) { const t = makeTx(d); S.transactions.push(t); persist(); return t; },
  update(id, patch) {
    const t = Tx.get(id); if (!t) return null;
    Object.assign(t, patch, { amount: patch.amount !== undefined ? U.round2(patch.amount) : t.amount, updatedAt: U.nowISO() });
    persist(); return t;
  },
  remove(id) {
    const i = S.transactions.findIndex(t => t.id === id); if (i < 0) return false;
    S.transactions.splice(i, 1); S.deleted[id] = U.nowISO(); persist(); return true;
  },
  removeMany(ids) {
    const set = new Set(ids); const now = U.nowISO();
    S.transactions = S.transactions.filter(t => { if (set.has(t.id)) { S.deleted[t.id] = now; return false; } return true; });
    persist();
  },
  /** Parcelamento: o valor informado é o total da compra. Cria uma parcela por mês a partir da parcela atual. */
  addInstallments(d, total, current, cardName) {
    const groupId = U.uid();
    const per = U.round2(d.amount / total);
    const created = [];
    for (let n = current, i = 0; n <= total; n++, i++) {
      const amount = n === total ? U.round2(d.amount - per * (total - 1)) : per;
      const t = makeTx(Object.assign({}, d, {
        amount, date: U.addMonths(d.date, i), cardName,
        installment: { groupId, number: n, total, totalAmount: U.round2(d.amount) }
      }));
      S.transactions.push(t); created.push(t);
    }
    persist(); return created;
  },
  group(groupId) { return S.transactions.filter(t => t.installment && t.installment.groupId === groupId).sort((a, b) => a.installment.number - b.installment.number); }
};
const byDateDesc = (a, b) => (b.date + (b.time || '') + b.createdAt).localeCompare(a.date + (a.time || '') + a.createdAt);

function searchTx(list, q) {
  const words = U.norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return list;
  return list.filter(t => {
    const hay = U.norm([t.description, t.category, t.subcategory, t.paymentMethod, t.user, t.cardName].join(' '));
    return words.every(w => hay.includes(w));
  });
}
function filterTx(list, f) {
  const min = f.min !== '' && f.min != null ? U.parseAmount(f.min) : null;
  const max = f.max !== '' && f.max != null ? U.parseAmount(f.max) : null;
  let out = list.filter(t => {
    if (f.user && t.user !== f.user) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.category && t.category !== f.category) return false;
    if (f.method && t.paymentMethod !== f.method) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (min !== null && !isNaN(min) && t.amount < min) return false;
    if (max !== null && !isNaN(max) && t.amount > max) return false;

/* =========================================================
   RECORRÊNCIAS
   Ocorrências são criadas quando a data chega (ao abrir o app),
   com ID determinístico — evita duplicar ao sincronizar aparelhos.
   ========================================================= */
const Rec = {
  get(id) { return S.recurrences.find(r => r.id === id); },
  dateAt(r, k) {
    switch (r.frequency) {
      case 'daily': return U.addDays(r.startDate, k);
      case 'weekly': return U.addDays(r.startDate, 7 * k);
      case 'yearly': return U.addMonths(r.startDate, 12 * k);
      default: return U.addMonths(r.startDate, k);
    }
  },
  next(r) { return r.active ? Rec.dateAt(r, r.nextIndex) : null; },
  templateFrom(t) {
    return { user: t.user, type: t.type, category: t.category, subcategory: t.subcategory, description: t.description, amount: t.amount, paymentMethod: t.paymentMethod, cardName: t.cardName || '', time: t.time };
  },
  /** Transforma um lançamento em recorrente. Não recria datas passadas: a próxima ocorrência é sempre futura. */
  create(t, frequency) {
    const r = { id: U.uid(), frequency, startDate: t.date, nextIndex: 1, active: true, template: Rec.templateFrom(t), createdAt: U.nowISO(), updatedAt: U.nowISO() };
    const today = U.today(); let guard = 0;
    while (Rec.dateAt(r, r.nextIndex) < today && guard++ < 5000) r.nextIndex++;
    S.recurrences.push(r);
    t.recurring = true; t.recurrenceId = r.id; t.updatedAt = U.nowISO();
    persist(); Rec.generate(); return r;
  },
  generate() {
    if (Cloud.on && !Cloud.everSynced) return 0; // espera conhecer as exclusões do servidor
    const today = U.today(); let created = 0;
    const ids = new Set(S.transactions.map(t => t.id));
    for (const r of S.recurrences) {
      if (!r.active) continue;
      let guard = 0;
      while (guard++ < 4000) {
        const date = Rec.dateAt(r, r.nextIndex);
        if (date > today) break;
        const id = 'rec-' + r.id + '-' + date;
        if (!ids.has(id) && !S.deleted[id]) {
          S.transactions.push(makeTx(Object.assign({}, r.template, { id, date, recurrenceId: r.id })));
          ids.add(id); created++;
        }
        r.nextIndex++; r.updatedAt = U.nowISO();
      }
    }
    if (created) persist();
    return created;
  },
  update(id, patch) {
    const r = Rec.get(id); if (!r) return null;
    if (patch.frequency && patch.frequency !== r.frequency) {
      const lastDate = Rec.dateAt(r, Math.max(0, r.nextIndex - 1));
      r.frequency = patch.frequency; r.startDate = lastDate; r.nextIndex = 1;
      const today = U.today(); let guard = 0;
      while (Rec.dateAt(r, r.nextIndex) < today && guard++ < 5000) r.nextIndex++;
    }
    if (patch.template) Object.assign(r.template, patch.template);
    r.updatedAt = U.nowISO(); persist(); Rec.generate(); return r;
  },
  cancel(id) { const r = Rec.get(id); if (!r) return; r.active = false; r.endedAt = U.today(); r.updatedAt = U.nowISO(); persist(); },
  resume(id) {
    const r = Rec.get(id); if (!r) return; r.active = true; r.endedAt = null;
    const today = U.today(); let guard = 0;
    while (Rec.dateAt(r, r.nextIndex) < today && guard++ < 5000) r.nextIndex++;
    r.updatedAt = U.nowISO(); persist(); Rec.generate();
  },
  occurrences(id) { return S.transactions.filter(t => t.recurrenceId === id); }
};

/* =========================================================
   CÁLCULOS (dashboard.js)
   ========================================================= */
const Calc = {
  inRange(list, from, to) { return list.filter(t => t.date >= from && t.date <= to); },
  income(list) { return U.round2(list.reduce((s, t) => s + (t.type === 'income' ? t.amount : 0), 0)); },
  expense(list) { return U.round2(list.reduce((s, t) => s + (t.type === 'expense' ? t.amount : 0), 0)); },
  balance(list) { return U.round2(Calc.income(list) - Calc.expense(list)); },
  /** Saldo acumulado de tudo que já aconteceu (parcelas futuras ficam de fora). */
  currentBalance() { const t = U.today(); return Calc.balance(S.transactions.filter(x => x.date <= t)); },
  balanceBefore(date) { return Calc.balance(S.transactions.filter(x => x.date < date)); },
  byCategory(list, type = 'expense') {
    const map = new Map(); let total = 0;
    for (const t of list) {
      if (t.type !== type) continue;
      total += t.amount;
      const c = map.get(t.category) || { name: t.category, icon: Cat.icon(type, t.category), total: 0, count: 0, subs: new Map() };
      c.total += t.amount; c.count++;
      const sk = t.subcategory || 'Sem subcategoria';
      c.subs.set(sk, (c.subs.get(sk) || 0) + t.amount);
      map.set(t.category, c);
    }
    return [...map.values()].map(c => Object.assign(c, { total: U.round2(c.total), pct: total ? c.total / total : 0 })).sort((a, b) => b.total - a.total);
  },
  byPerson(list) {
    const out = {};
    for (const u of USERS) out[u] = { income: 0, expense: 0, count: 0 };
    for (const t of list) {
      const p = out[t.user] || (out[t.user] = { income: 0, expense: 0, count: 0 });
      p[t.type] += t.amount; p.count++;
    }
    for (const u in out) { out[u].income = U.round2(out[u].income); out[u].expense = U.round2(out[u].expense); out[u].balance = U.round2(out[u].income - out[u].expense); }
    return out;
  },
  byDay(list) {
    const m = {};
    for (const t of list) { const d = m[t.date] || (m[t.date] = { income: 0, expense: 0, count: 0 }); d[t.type] += t.amount; d.count++; }
    return m;
  }
};

/* =========================================================
   ORÇAMENTOS
   ========================================================= */
const Budget = {
  get(name) { return Number(S.budgets[name]) || 0; },
  set(name, v) { if (v > 0) S.budgets[name] = U.round2(v); else delete S.budgets[name]; S.budgetsUpdatedAt = U.nowISO(); persist(); },
  setGeneral(v) { S.monthlyBudget = v > 0 ? U.round2(v) : 0; S.budgetsUpdatedAt = U.nowISO(); persist(); },
  monthList(y, m) { const from = `${y}-${U.pad(m + 1)}-01`, to = `${y}-${U.pad(m + 1)}-${U.pad(U.lastDay(y, m))}`; return Calc.inRange(S.transactions, from, to); },
  status(spent, limit) {
    if (!limit) return null;
    const pct = spent / limit;
    return { pct, level: pct > 1 ? 'over' : pct >= 0.8 ? 'near' : 'ok', over: U.round2(spent - limit), left: U.round2(limit - spent) };
  },
  statusText(st) {
    if (!st) return '';
    if (st.level === 'over') return 'Limite ultrapassado em ' + U.money(st.over) + '.';
    if (st.level === 'near') return 'Perto do limite: restam ' + U.money(st.left) + '.';
    return Math.round(st.pct * 100) + '% utilizado. Restam ' + U.money(st.left) + '.';
  }
};

/* =========================================================
   PERÍODO
   ========================================================= */
const nowD = new Date();
const Period = { mode: 'month', y: nowD.getFullYear(), m: nowD.getMonth(), from: '', to: '' };
function range() {
  const t = U.today();
  switch (Period.mode) {
    case 'today': return { from: t, to: t, label: 'Hoje, ' + U.short(t), noun: 'de hoje' };
    case 'week': {
      const dow = (U.parse(t).getDay() + 6) % 7; const from = U.addDays(t, -dow), to = U.addDays(from, 6);
      return { from, to, label: 'Semana ' + U.short(from) + ' a ' + U.short(to), noun: 'da semana' };
    }
    case 'year': return { from: `${Period.y}-01-01`, to: `${Period.y}-12-31`, label: String(Period.y), noun: 'do ano' };
    case 'custom': return { from: Period.from, to: Period.to, label: U.short(Period.from) + (Period.from.slice(0,4) !== Period.to.slice(0,4) ? '/' + Period.from.slice(0,4) : '') + ' a ' + U.br(Period.to), noun: 'do período' };
    default: {
      const from = `${Period.y}-${U.pad(Period.m + 1)}-01`;
      return { from, to: `${Period.y}-${U.pad(Period.m + 1)}-${U.pad(U.lastDay(Period.y, Period.m))}`, label: MONTHS[Period.m] + ' ' + Period.y, noun: 'do mês' };
    }
  }
}
function shiftPeriod(dir) {
  if (Period.mode === 'year') { Period.y += dir; }
  else {
    if (Period.mode !== 'month') Period.mode = 'month';
    else { const d = new Date(Period.y, Period.m + dir, 1); Period.y = d.getFullYear(); Period.m = d.getMonth(); }
  }
  render();
}
function setPreset(p) {
  const n = new Date();
  if (p === 'custom') { openCustomPeriod(); return; }
  if (p === 'thisMonth') { Period.mode = 'month'; Period.y = n.getFullYear(); Period.m = n.getMonth(); }
  else if (p === 'lastMonth') { const d = new Date(n.getFullYear(), n.getMonth() - 1, 1); Period.mode = 'month'; Period.y = d.getFullYear(); Period.m = d.getMonth(); }
  else if (p === 'year') { Period.mode = 'year'; Period.y = n.getFullYear(); }
  else Period.mode = p;
  render();
}
function activePreset() {
  const n = new Date();
  if (Period.mode === 'month') {
    if (Period.y === n.getFullYear() && Period.m === n.getMonth()) return 'thisMonth';
    const d = new Date(n.getFullYear(), n.getMonth() - 1, 1);
    if (Period.y === d.getFullYear() && Period.m === d.getMonth()) return 'lastMonth';
    return '';
  }
  if (Period.mode === 'year') return Period.y === n.getFullYear() ? 'year' : '';
  return Period.mode;
}
/** Período anterior comparável. Se o mês atual ainda está em andamento, compara até o mesmo dia. */
function comparable() {
  if (Period.mode !== 'month') return null;
  const r = range(); const t = U.today();
  const pm = new Date(Period.y, Period.m - 1, 1);
  const pFrom = U.iso(pm);
  let pTo = U.iso(new Date(pm.getFullYear(), pm.getMonth() + 1, 0));
  let cTo = r.to, partial = false, day = null;
  if (t >= r.from && t <= r.to) {
    day = Number(t.slice(8)); partial = true; cTo = t;
    pTo = pFrom.slice(0, 8) + U.pad(Math.min(day, U.lastDay(pm.getFullYear(), pm.getMonth())));
  } else if (t < r.from) return null;
  return { cur: { from: r.from, to: cTo }, prev: { from: pFrom, to: pTo }, partial, day };
}

const sheets = [];
function openSheet({ title, body, foot = '', onMount, onClose }) {

  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-backdrop" data-act="sheet-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">

}

function ask({ title, message, actions }) {

    const s = openSheet({
      title,
      body: `<p style="margin:0">${message}</p>`,
      foot: `<div class="btn-col">${actions.map((a, i) => `<button class="btn ${a.danger ? 'btn-danger' : a.primary ? 'btn-primary' : 'btn-ghost'} btn-block" data-act="ask" data-i="${i}">${U.esc(a.label)}</button>`).join('')}
        <button class="btn btn-line btn-block" data-act="sheet-close">Cancelar</button></div>`,
      onClose: () => { if (!done) res(null); }

  });
}

function txGrouped(list, { showDayTotals = true } = {}) {
  if (!list.length) return '';
  const groups = new Map();
  for (const t of list) { if (!groups.has(t.date)) groups.set(t.date, []); groups.get(t.date).push(t); }
  let html = '';
  for (const [date, items] of groups) {
    const bal = Calc.balance(items);
    html += `<div class="dayhead"><span>${U.esc(U.dayLabel(date))}</span>${showDayTotals ? `<span class="${bal >= 0 ? 'pos' : 'neg'}">${bal >= 0 ? '+' : '−'}${U.money(Math.abs(bal))}</span>` : ''}</div>
      <div class="txgroup">${items.map(txRow).join('')}</div>`;
  }
  return `<div class="txlist">${html}</div>`;
}
function catLines(cats, opts = {}) {
  return cats.map(c => {
    const lim = opts.budget ? Budget.get(c.name) : 0;
    const st = lim ? Budget.status(c.total, lim) : null;
    const w = st ? Math.min(100, st.pct * 100) : Math.max(2, c.pct * 100);
    const open = opts.expandable && expanded === c.name;
    return `<button class="catline" ${opts.expandable ? `data-act="cat-expand" data-name="${U.esc(c.name)}" aria-expanded="${open}"` : 'data-act="nav" data-view="cats"'}>
      <span class="cat-ic">${c.icon}</span>
      <span><span class="nm">${U.esc(c.name)} <small>${Math.round(c.pct * 100)}%</small></span>
        <span class="bar ${st ? st.level : ''}"><i style="width:${w}%"></i></span>
        ${st ? `<span class="status ${st.level}">${U.money(c.total)} / ${U.money(lim)}. ${Budget.statusText(st)}</span>` : ''}</span>
      <span class="val">${U.money(c.total)}</span></button>
      ${open ? `<div class="subs">${[...c.subs.entries()].sort((a, b) => b[1] - a[1]).map(([n, v]) => `<div><span>${U.esc(n)}</span><b>${U.money(v)}</b></div>`).join('')}</div>` : ''}`;
  }).join('');
}

function insights(list, r) {
  const out = [];
  const exp = list.filter(t => t.type === 'expense');
  const cmp = comparable();
  if (cmp) {
    const cur = Calc.expense(Calc.inRange(S.transactions, cmp.cur.from, cmp.cur.to));
    const prevList = Calc.inRange(S.transactions, cmp.prev.from, cmp.prev.to);
    if (prevList.length) {
      const prev = Calc.expense(prevList); const diff = U.round2(cur - prev);
      const when = cmp.partial ? ` (comparando até o dia ${cmp.day})` : '';
      if (diff < 0) out.push(['📉', `Vocês gastaram ${U.money(-diff)} a menos que no mês passado${when}.`]);
      else if (diff > 0) out.push(['📈', `Vocês gastaram ${U.money(diff)} a mais que no mês passado${when}.`, true]);
      else out.push(['⚖️', `Os gastos estão iguais aos do mês passado${when}.`]);
    }
  }
  const cats = Calc.byCategory(list);
  if (cats[0]) out.push([cats[0].icon, `Sua maior categoria de gasto é ${cats[0].name}, com ${Math.round(cats[0].pct * 100)}% das saídas.`]);
  if (cats[1]) out.push([cats[1].icon, `${cats[1].name} representa ${Math.round(cats[1].pct * 100)}% dos seus gastos ${r.noun === 'do mês' ? 'neste mês' : 'no período'}.`]);
  const byP = Calc.byPerson(list);
  for (const u of USERS) if (byP[u].count) out.push(['📝', `${u} realizou ${byP[u].count} ${byP[u].count === 1 ? 'lançamento' : 'lançamentos'} ${r.noun === 'do mês' ? 'neste mês' : 'no período'}.`]);
  if (exp.length) {
    const big = exp.reduce((a, b) => (b.amount > a.amount ? b : a));
    out.push(['🔎', `Maior gasto: ${big.description || big.category}, ${U.money(big.amount)} em ${U.short(big.date)}.`]);
  }
  if (Period.mode === 'month') {
    const ml = Budget.monthList(Period.y, Period.m);
    for (const c of Calc.byCategory(ml)) {
      const st = Budget.status(c.total, Budget.get(c.name));
      if (st && st.level === 'over') out.push(['⚠️', `${c.name}: limite ultrapassado em ${U.money(st.over)}.`, true]);
      else if (st && st.level === 'near') out.push(['⚠️', `${c.name} já usou ${Math.round(st.pct * 100)}% do limite.`, true]);
    }
  }
  return out;
}

function storageBanner() {

function backupNag() {
  if (!S.transactions.length) return '';
  const last = D.lastBackup ? new Date(D.lastBackup) : null;
  const days = last ? Math.floor((Date.now() - last) / 864e5) : null;
  const limit = Cloud.on ? 30 : 14;
  if (days !== null && days < limit) return '';
  return `<div class="info" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between"><span>${days === null ? 'Você ainda não fez nenhum backup.' : `Último backup há ${days} dias.`} ${Cloud.on ? 'O plano gratuito do Supabase não guarda cópias de segurança: faça um backup por mês.' : 'Os dados vivem só neste aparelho.'}</span><button class="btn btn-primary" style="min-height:40px;flex:none" data-act="backup">Fazer backup</button></div>`;
}

const charts = {};
function destroyCharts() { for (const k in charts) { try { charts[k].destroy(); } catch (e) {} delete charts[k]; } }
function cssv(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function makeChart(id, cfg) {
  const el = document.getElementById(id); if (!el) return;
  if (typeof Chart === 'undefined') { el.parentElement.innerHTML = '<p class="muted">Os gráficos precisam da internet na primeira abertura. Os números continuam corretos nas outras telas.</p>'; return; }
  Chart.defaults.font.family = cssv('--font-ui') || 'system-ui';
  Chart.defaults.color = cssv('--ink-2');
  Chart.defaults.borderColor = cssv('--line');
  charts[id] = new Chart(el, cfg);
}
const moneyTick = v => { const a = Math.abs(v); return (v < 0 ? '−' : '') + 'R$ ' + (a >= 1000 ? (a / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : a.toLocaleString('pt-BR')); };
const tip = { callbacks: { label: c => ' ' + (c.dataset.label ? c.dataset.label + ': ' : c.label ? c.label + ': ' : '') + U.money(c.parsed.y ?? c.parsed) } };
function chartDonut(id, cats) {
  makeChart(id, {
    type: 'doughnut',
    data: { labels: cats.map(c => c.name), datasets: [{ data: cats.map(c => c.total), backgroundColor: cats.map((_, i) => CAT_COLORS[i % CAT_COLORS.length]), borderColor: cssv('--surface'), borderWidth: 3 }] },
    options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } }, tooltip: { callbacks: { label: c => ` ${c.label}: ${U.money(c.parsed)} (${Math.round(cats[c.dataIndex].pct * 100)}%)` } } } }
  });
}
function chartInOut(id) {
  const labels = [], inc = [], exp = [];
  const months = Period.mode === 'year' ? 12 : 6;
  for (let i = months - 1; i >= 0; i--) {
    const d = Period.mode === 'year' ? new Date(Period.y, 11 - i, 1) : new Date(Period.y, Period.m - i, 1);
    const l = Budget.monthList(d.getFullYear(), d.getMonth());
    labels.push(MONTHS_S[d.getMonth()] + (d.getMonth() === 0 || i === months - 1 ? '/' + String(d.getFullYear()).slice(2) : ''));
    inc.push(Calc.income(l)); exp.push(Calc.expense(l));
  }
  makeChart(id, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Entradas', data: inc, backgroundColor: cssv('--in'), borderRadius: 6 }, { label: 'Saídas', data: exp, backgroundColor: cssv('--out'), borderRadius: 6 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } }, tooltip: tip }, scales: { y: { ticks: { callback: moneyTick } }, x: { grid: { display: false } } } }
  });
}
function balanceSeries(r) {
  const t = U.today();
  let end = r.to <= t ? r.to : (t >= r.from ? t : r.to);
  const labels = [], data = [];
  let running = Calc.balanceBefore(r.from);
  const byDay = Calc.byDay(Calc.inRange(S.transactions, r.from, end));
  const days = Math.round((U.parse(end) - U.parse(r.from)) / 864e5) + 1;
  if (days > 62) {
    let d = r.from;
    let mk = d.slice(0, 7);
    while (d <= end) {
      const x = byDay[d]; if (x) running += x.income - x.expense;
      const nd = U.addDays(d, 1);
      if (nd.slice(0, 7) !== mk || nd > end) { const mi = Number(mk.slice(5)) - 1; labels.push(MONTHS_S[mi] + '/' + mk.slice(2, 4)); data.push(U.round2(running)); mk = nd.slice(0, 7); }
      d = nd;
    }
  } else {
    for (let d = r.from; d <= end; d = U.addDays(d, 1)) {
      const x = byDay[d]; if (x) running += x.income - x.expense;
      labels.push(U.short(d)); data.push(U.round2(running));
    }
  }
  return { labels, data };
}
function chartBalance(id, r) {
  const { labels, data } = balanceSeries(r);
  const brand = cssv('--brand');
  makeChart(id, {
    type: 'line',
    data: { labels, datasets: [{ label: 'Saldo', data, borderColor: brand, backgroundColor: brand + '22', fill: true, tension: .25, pointRadius: data.length > 20 ? 0 : 3, borderWidth: 2.5 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: tip }, scales: { y: { ticks: { callback: moneyTick } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } } } }
  });
}

function viewCouple() {
  const r = range();
  const list = Calc.inRange(S.transactions, r.from, r.to);
  const p = Calc.byPerson(list);
  const tot = { income: Calc.income(list), expense: Calc.expense(list) }; tot.balance = U.round2(tot.income - tot.expense);
  const card = (name, x, cls) => `<section class="person ${cls}"><h3>${name}</h3>
    <div class="kv"><span>Entradas</span><b class="pos">${U.money(x.income)}</b></div>
    <div class="kv"><span>Saídas</span><b class="neg">${U.money(x.expense)}</b></div>
    <div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:9px"><span>Saldo</span><b class="${x.balance >= 0 ? 'pos' : 'neg'}">${U.money(x.balance)}</b></div></section>`;
  const share = (key, label) => {
    const total = tot[key]; if (!total) return '';
    const a = p[USERS[0]][key] / total, b = p[USERS[1]][key] / total;
    return `<div><div class="row between small" style="margin-bottom:6px"><b>${label}</b><span class="muted">${USERS[0]} ${Math.round(a * 100)}% e ${USERS[1]} ${Math.round(b * 100)}%</span></div>
      <div class="sharebar"><i style="width:${a * 100}%;background:var(--rafael)"></i><i style="width:${b * 100}%;background:var(--thayna)"></i></div></div>`;
  };
  const topBy = u => Calc.byCategory(list.filter(t => t.user === u)).slice(0, 3);
  return `<header class="topbar"><div>${subHeader('Finanças do casal')}</div></header>
  <div class="stack">${periodBar()}
    <div class="person-grid">${card('Rafael', p.Rafael, 'p-rafael')}${card('Thayná', p['Thayná'], 'p-thayna')}${card('Casal', tot, 'p-casal')}</div>
    ${tot.income || tot.expense ? `<section class="panel stack"><h2 style="margin:0">Participação de cada um</h2>${share('income', 'Entradas')}${share('expense', 'Saídas')}
      <p class="small muted" style="margin:0">Mostra quem registrou cada valor. Não assume divisão igual entre os dois.</p></section>` : ''}
    <div class="person-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      ${USERS.map(u => { const c = topBy(u); return `<section class="panel"><h2>Maiores gastos de ${u}</h2>${c.length ? catLines(c) : '<p class="muted" style="margin:0">Sem saídas no período.</p>'}</section>`; }).join('')}
    </div>
  </div>`;
}

/* =========================================================

   ========================================================= */
function viewCalendar() {
  if (Period.mode !== 'month') Period.mode = 'month';
  const y = Period.y, m = Period.m, t = U.today();
  const byDay = Calc.byDay(Budget.monthList(y, m));
  const first = new Date(y, m, 1).getDay(); const last = U.lastDay(y, m);
  let cells = WEEK.map(w => `<div class="wd">${w[0]}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div class="d blank"></div>';
  const short = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : Math.round(v).toLocaleString('pt-BR');
  for (let d = 1; d <= last; d++) {
    const iso = `${y}-${U.pad(m + 1)}-${U.pad(d)}`; const x = byDay[iso];
    cells += `<button class="d${iso === t ? ' today' : ''}${x ? ' has' : ''}" data-act="cal-day" data-d="${iso}" aria-label="${U.br(iso)}${x ? `: entradas ${U.money(x.income)}, saídas ${U.money(x.expense)}` : ''}">
      <b>${d}</b>${x && x.income ? `<span class="i">+${short(x.income)}</span>` : ''}${x && x.expense ? `<span class="o">−${short(x.expense)}</span>` : ''}</button>`;
  }
  const ml = Budget.monthList(y, m);
  return `<header class="topbar"><div>${subHeader('Calendário')}</div></header>
  <div class="stack">${periodBar({ noPresets: true })}
    <div class="totals"><span>Entradas <b class="pos">${U.money(Calc.income(ml))}</b></span><span>Saídas <b class="neg">${U.money(Calc.expense(ml))}</b></span><span>Saldo <b>${U.money(Calc.balance(ml))}</b></span></div>
    <section class="panel" style="padding:10px"><div class="cal">${cells}</div></section>
    <p class="small muted" style="margin:0">Toque num dia para ver as movimentações. Valores resumidos: 1,2k = R$ 1.200.</p>
  </div>`;
}
function openDay(iso) {
  const list = S.transactions.filter(t => t.date === iso).sort(byDateDesc);

let downloadsNS = null;
if (window.claude && typeof window.claude.use === 'function') { window.claude.use('downloads').then(d => { downloadsNS = d; }).catch(() => {}); }
async function saveFile(filename, text, mime) {
  if (downloadsNS) {
    try { await downloadsNS.save({ filename, data: text }); return true; }
    catch (e) { if (e && e.code === 'declined') { toast('Download cancelado'); return false; } if (e && e.code === 'rate_limited') { toast('Aguarde um instante e tente de novo'); return false; } }
  }
  try {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { toast('Este navegador bloqueou o download.'); return false; }
}
function exportJSON() { return JSON.stringify({ app: APP_ID, schema: 1, exportedAt: U.nowISO(), data: S }, null, 2); }
function exportCSV() {
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['id', 'data', 'hora', 'pessoa', 'tipo', 'categoria', 'subcategoria', 'descricao', 'valor', 'forma', 'cartao', 'parcela', 'recorrente'];
  const rows = [...S.transactions].sort((a, b) => a.date.localeCompare(b.date)).map(t => [t.id, U.br(t.date), t.time, t.user, t.type === 'income' ? 'Entrada' : 'Saída', t.category, t.subcategory, t.description, U.plain(t.amount).replace(/\./g, ''), t.paymentMethod, t.cardName, t.installment ? t.installment.number + '/' + t.installment.total : '', t.recurrenceId ? 'sim' : 'não'].map(q).join(';'));
  return '\ufeff' + head.join(';') + '\n' + rows.join('\n');
}
async function doBackup() {
  const ok = await saveFile(`financas-backup-${U.today()}.json`, exportJSON(), 'application/json');
  if (ok) { D.lastBackup = U.nowISO(); saveDevice(); render(); toast('Backup gerado'); }
}
function parseBackup(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { return { error: 'O arquivo não é um JSON válido.' }; }
  const data = obj && obj.data ? obj.data : obj;
  if (!data || !Array.isArray(data.transactions)) return { error: 'Este arquivo não parece um backup deste aplicativo.' };
  return { data: migrate(data) };
}
function mergeData(inc) {
  const before = S.transactions.length;
  const tomb = Object.assign({}, S.deleted, inc.deleted || {});
  const map = new Map(S.transactions.map(t => [t.id, t]));
  let updated = 0;
  for (const t of inc.transactions) {
    const cur = map.get(t.id);
    if (!cur) map.set(t.id, t);
    else if ((t.updatedAt || '') > (cur.updatedAt || '')) { map.set(t.id, t); updated++; }
  }
  S.transactions = [...map.values()].filter(t => !tomb[t.id]);
  S.deleted = tomb;
  const rmap = new Map(S.recurrences.map(r => [r.id, r]));
  for (const r of inc.recurrences) {
    const cur = rmap.get(r.id);
    if (!cur) rmap.set(r.id, r);
    else { const newer = (r.updatedAt || '') > (cur.updatedAt || '') ? r : cur; newer.nextIndex = Math.max(r.nextIndex, cur.nextIndex); rmap.set(r.id, newer); }
  }
  S.recurrences = [...rmap.values()];
  for (const type of ['expense', 'income']) {
    for (const c of inc.categories[type]) {
      const mine = Cat.find(type, c.name);
      if (!mine) S.categories[type].push(c);
      else if (type === 'expense') for (const s of c.subs) if (!mine.subs.some(x => U.norm(x) === U.norm(s))) { mine.subs.push(s); if ((c.customSubs || []).includes(s)) mine.customSubs = [...(mine.customSubs || []), s]; }
    }
  }
  if ((inc.budgetsUpdatedAt || '') > (S.budgetsUpdatedAt || '')) { S.budgets = inc.budgets; S.monthlyBudget = inc.monthlyBudget; S.budgetsUpdatedAt = inc.budgetsUpdatedAt; }
  Rec.generate(); persist();
  return { added: S.transactions.length - before, updated };
}
let fileMode = 'restore';
function pickFile(mode) { fileMode = mode; const el = document.getElementById('file-in'); el.value = ''; el.click(); }
async function onFile(file) {
  if (!file) return;
  const text = await file.text();
  const p = parseBackup(text);
  if (p.error) { toast(p.error); return; }
  if (fileMode === 'restore') {
    const v = await ask({ title: 'Restaurar backup', message: `Substituir todos os dados atuais (${S.transactions.length} lançamentos) pelos ${p.data.transactions.length} lançamentos do backup?${Cloud.on ? ' A troca vale para vocês dois.' : ''}`, actions: [{ label: 'Substituir tudo', value: 'yes', danger: true }] });
    if (!v) return;
    S = p.data; Rec.generate(); persist(); render(); toast('Backup restaurado');
  } else {
    const res = mergeData(p.data); render();
    toast(`Importado: ${res.added >= 0 ? res.added + ' novos' : Math.abs(res.added) + ' removidos'}, ${res.updated} atualizados`);
  }
}

   PIN (hash PBKDF2 com sal; nunca em texto puro)
   ========================================================= */
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Pin = {
  supported() { return !!(window.crypto && crypto.subtle && window.isSecureContext); },
  async hash(pin, salt, iter) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(salt), iterations: iter, hash: 'SHA-256' }, key, 256);
    return b64e(bits);
  },
  async set(pin) { const salt = b64e(crypto.getRandomValues(new Uint8Array(16))); const iter = 150000; D.pin = { salt, iter, len: pin.length, hash: await Pin.hash(pin, salt, iter) }; saveDevice(); },
  async check(pin) { return D.pin && (await Pin.hash(pin, D.pin.salt, D.pin.iter)) === D.pin.hash; }
};

async function pinKey(k) {
  if (lockUntil > Date.now()) { renderLock(); return; }
  if (pinBuf.length >= D.pin.len) return;
  pinBuf += k; renderLock();
  if (pinBuf.length === D.pin.len) {
    const ok = await Pin.check(pinBuf);
    if (ok) { locked = false; fails = 0; pinBuf = ''; document.getElementById('overlay').innerHTML = ''; checkWelcome(); render(); }
    else {
      fails++; pinBuf = '';
      if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; const iv = setInterval(() => { if (!locked || lockUntil <= Date.now()) { clearInterval(iv); } if (locked) renderLock(); }, 1000); }
      renderLock('PIN incorreto'); const dots = document.getElementById('pin-dots'); if (dots) dots.classList.add('shake');
    }
  }
}

async function runDiagnostics() {
  const el = document.getElementById('diag'); if (!el) return;
  el.innerHTML = '<p class="muted" style="margin:0">Testando…</p>';
  const ok = storageProbe(); storageOK = ok;
  let raw = null; try { raw = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); } catch (e) {}
  const stored = raw && Array.isArray(raw.transactions) ? raw.transactions.length : 0;
  let persisted = 'não informado', space = 'não informado';
  try { if (navigator.storage && navigator.storage.persisted) persisted = (await navigator.storage.persisted()) ? 'Sim' : 'Não (o navegador pode limpar quando faltar espaço ou após dias sem uso)'; } catch (e) {}
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); space = (e.usage / 1024).toFixed(0) + ' KB usados'; } } catch (e) {}
  const mode = isStandalone() ? 'App instalado (ícone da tela inicial)' : inAppBrowser ? 'Navegador interno de outro app (não recomendado)' : 'Navegador comum';
  const row = (k, v, bad) => `<dt>${k}</dt><dd${bad ? ' class="neg"' : ''}>${v}</dd>`;
  el.innerHTML = `<dl class="dl">
    ${row('Salvamento', ok ? 'Funcionando' : 'Bloqueado pelo navegador', !ok)}
    ${Cloud.on ? row('Lançamentos (nuvem + cópia local)', String(S.transactions.length)) : row('Lançamentos gravados', stored + (stored !== S.transactions.length ? ` (na tela: ${S.transactions.length})` : ''), stored !== S.transactions.length)}
    ${row('Última gravação', raw && raw.updatedAt ? new Date(raw.updatedAt).toLocaleString('pt-BR') : 'nenhuma')}
    ${Cloud.on ? row('Nuvem', Cloud.statusInfo()[1], Cloud.statusInfo()[0] === 'error') + row('Alterações a enviar', String(Object.keys(Cloud.pending).length)) : ''}
    ${row('Aberto como', mode, inAppBrowser)}
    ${row('Endereço', U.esc(location.host + location.pathname))}
    ${row('Proteção contra limpeza', persisted)}
    ${row('Espaço', space)}
    ${row('Teste feito em', new Date().toLocaleString('pt-BR'))}

  <p class="small muted" style="margin:0">Os dados valem só para este endereço e este modo de abertura. No iPhone, Safari e ícone da tela inicial são armazenamentos diferentes.</p>`;
}

   NUVEM (Supabase): login, banco compartilhado e sincronização
   Cada lançamento, recorrência e a configuração viram uma linha
   na tabela "docs". O app guarda uma cópia local (funciona offline)
   e envia/recebe só o que mudou.
   ========================================================= */
const CFG = window.FINANCAS_CONFIG || null;
const CFG_INCOMPLETE = !!CFG && (!CFG.supabaseUrl || !CFG.supabaseAnonKey || /SEU-PROJETO/i.test(CFG.supabaseUrl) || /COLE-A-CHAVE/i.test(CFG.supabaseAnonKey));
const DEL = '~';
function stable(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}
function hash53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const fp = v => hash53(stable(v));
const clone = v => JSON.parse(JSON.stringify(v));
function configOf(s) { return { categories: s.categories, budgets: s.budgets, monthlyBudget: s.monthlyBudget, budgetsUpdatedAt: s.budgetsUpdatedAt || null }; }
const EMAILS_SET = !!(CFG && CFG.emails && Object.values(CFG.emails).some(v => v && !/exemplo/i.test(v)));
function nameForEmail(email) {
  if (!EMAILS_SET) return null;
  const e = String(email || '').toLowerCase().trim(); const map = (CFG && CFG.emails) || {};
  return USERS.find(u => e && String(map[u] || '').toLowerCase().trim() === e) || null;
}
function validRec(r) { return r && typeof r.id === 'string' && FREQS[r.frequency] && r.template && typeof r.startDate === 'string'; }
function mergeCategories(remote, local) {
  const out = clone(remote || { expense: [], income: [] }); out.expense = out.expense || []; out.income = out.income || [];
  for (const type of ['expense', 'income']) for (const c of (local && local[type]) || []) {
    const m = out[type].find(x => U.norm(x.name) === U.norm(c.name));
    if (!m) { if (c.custom) out[type].push(c); continue; }
    if (type === 'expense') for (const sb of c.subs || []) if (!(m.subs || []).some(x => U.norm(x) === U.norm(sb))) { m.subs = [...(m.subs || []), sb]; if ((c.customSubs || []).includes(sb)) m.customSubs = [...(m.customSubs || []), sb]; }
  }
  return out;
}
function dataNote() { return Cloud.on ? 'Dados salvos na nuvem e compartilhados entre Rafael e Thayná.' : 'Seus dados estão armazenados neste dispositivo.'; }
function syncBadge() { if (!Cloud.on) return ''; const [c, l] = Cloud.statusInfo(); return `<span class="sync ${c}" data-sync>${U.esc(l)}</span>`; }

const Cloud = {
  on: false, client: null, user: null, email: '', known: new Map(), pending: {}, cursor: null, everSynced: false,
  state: 'ok', error: '', lastSync: null, pushing: false, pulling: false, tPush: null, tPull: null, loginShown: false, deferred: false,
  key() { return 'financas-rt:cloud:' + Cloud.user.id; },
  saveCache() { if (Cloud.user) Store.write(Cloud.key(), { S, known: [...Cloud.known], pending: Cloud.pending, cursor: Cloud.cursor, everSynced: Cloud.everSynced, lastSync: Cloud.lastSync }); },
  loadCache() {
    const c = Store.read(Cloud.key()); if (!c || !c.S) return false;
    S = migrate(c.S); Cloud.known = new Map(c.known || []); Cloud.pending = c.pending || {}; Cloud.cursor = c.cursor || null; Cloud.everSynced = !!c.everSynced; Cloud.lastSync = c.lastSync || null;
    return true;
  },
  msg(e) {
    const m = String((e && (e.message || e.error_description || e.msg)) || e || '');
    if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/email not confirmed/i.test(m)) return 'E-mail não confirmado. No Supabase, crie o usuário marcando "Auto Confirm User".';
    if (/row-level security|permission denied|42501/i.test(m)) return 'Sem permissão no banco. Confira se os e-mails do script SQL são os mesmos do config.js.';
    if (/relation .*docs.* does not exist|42P01|Could not find the table/i.test(m)) return 'A tabela "docs" não existe. Rode o script SQL no Supabase.';
    if (/jwt|token/i.test(m)) return 'Sessão expirada. Saia e entre de novo.';
    if (/failed to fetch|network|load failed/i.test(m)) return 'Sem conexão com o servidor. As alterações ficam guardadas e serão enviadas depois.';
    return m || 'Erro desconhecido ao sincronizar.';
  },
  statusInfo() {
    const n = Object.keys(Cloud.pending).length;
    if (Cloud.error && !/Sem conexão/.test(Cloud.error)) return ['error', 'Erro ao sincronizar'];
    if (!navigator.onLine || Cloud.error) return ['offline', n ? `Offline, ${n} para enviar` : 'Offline'];
    if (Cloud.pushing || Cloud.pulling) return ['syncing', 'Sincronizando…'];
    if (n) return ['pending', `${n} para enviar`];
    return ['ok', 'Sincronizado'];
  },
  paintStatus() { const [c, l] = Cloud.statusInfo(); document.querySelectorAll('[data-sync]').forEach(el => { el.className = 'sync ' + c; el.textContent = l; }); },
  /** Chamado por persist(): descobre o que mudou desde a última sincronização e enfileira. */
  commit() {
    const cur = new Map();
    for (const t of S.transactions) cur.set('tx_' + t.id, ['tx', t]);
    for (const r of S.recurrences) cur.set('rec_' + r.id, ['rec', r]);
    cur.set('config', ['config', configOf(S)]);
    for (const [id, [kind, data]] of cur) {
      const f = fp(data);
      if (Cloud.known.get(id) !== f) { Cloud.pending[id] = { id, kind, data: clone(data), deleted: false, f }; Cloud.known.set(id, f); }
    }
    for (const [id, f] of Cloud.known) {
      if (f !== DEL && !cur.has(id) && id !== 'config') { Cloud.pending[id] = { id, kind: id.startsWith('tx_') ? 'tx' : 'rec', data: {}, deleted: true, f: DEL }; Cloud.known.set(id, DEL); }
    }
    Cloud.saveCache(); Cloud.paintStatus(); Cloud.schedulePush();
    return true;
  },
  schedulePush(ms = 400) { clearTimeout(Cloud.tPush); Cloud.tPush = setTimeout(() => Cloud.push(), ms); },
  schedulePull(ms = 400) { clearTimeout(Cloud.tPull); Cloud.tPull = setTimeout(() => Cloud.pull(), ms); },
  async push() {
    if (!Cloud.user || Cloud.pushing || !Cloud.everSynced) return;
    const entries = Object.values(Cloud.pending);
    if (!entries.length) { Cloud.paintStatus(); return; }
    Cloud.pushing = true; Cloud.paintStatus();
    try {
      for (let i = 0; i < entries.length; i += 300) {
        const chunk = entries.slice(i, i + 300);
        const { error } = await Cloud.client.from('docs').upsert(chunk.map(e => ({ id: e.id, kind: e.kind, data: e.data, deleted: e.deleted })), { onConflict: 'id' });
        if (error) throw error;
        for (const e of chunk) if (Cloud.pending[e.id] && Cloud.pending[e.id].f === e.f) delete Cloud.pending[e.id];
      }
      Cloud.error = ''; Cloud.lastSync = U.nowISO();
    } catch (e) { Cloud.error = Cloud.msg(e); }
    Cloud.pushing = false; Cloud.saveCache(); Cloud.paintStatus();
    if (Object.keys(Cloud.pending).length && !Cloud.error) Cloud.schedulePush(1000);
  },
  async pull() {
    if (!Cloud.user || Cloud.pulling) return false;
    Cloud.pulling = true; Cloud.paintStatus(); let ok = false;
    try {
      // 5 min de sobreposição: cobre gravações que terminaram fora de ordem
      const since = Cloud.cursor ? new Date(Date.parse(Cloud.cursor) - 300000).toISOString() : '1970-01-01T00:00:00Z';
      let rows = [], from = 0, page;
      do {
        const { data, error } = await Cloud.client.from('docs').select('id,kind,data,deleted,updated_at').gt('updated_at', since).order('updated_at', { ascending: true }).order('id', { ascending: true }).range(from, from + 999);
        if (error) throw error;
        page = data || []; rows = rows.concat(page); from += 1000;
      } while (page.length === 1000);
      const first = !Cloud.everSynced;
      const changed = Cloud.apply(rows, first);
      for (const r of rows) if (!Cloud.cursor || Date.parse(r.updated_at) > Date.parse(Cloud.cursor)) Cloud.cursor = r.updated_at;
      Cloud.everSynced = true; Cloud.error = ''; Cloud.lastSync = U.nowISO(); ok = true;
      Cloud.saveCache();
      if (first) { Rec.generate(); persist(); }
      if (changed || first) Cloud.remoteRender();
    } catch (e) { Cloud.error = Cloud.msg(e); }
    Cloud.pulling = false; Cloud.paintStatus();
    return ok;
  },
  apply(rows, first) {
    if (!rows.length) return false;
    const txIdx = new Map(S.transactions.map((t, i) => [t.id, i]));
    const recIdx = new Map(S.recurrences.map((r, i) => [r.id, i]));
    const rmTx = new Set(), rmRec = new Set(); let changed = false;
    for (const row of rows) {
      if (Cloud.pending[row.id]) continue; // alteração local ainda não enviada tem prioridade
      const f = row.deleted ? DEL : fp(row.data);
      if (Cloud.known.get(row.id) === f) continue;
      changed = true; Cloud.known.set(row.id, f);
      if (row.kind === 'config') {
        if (row.deleted || !row.data) continue;
        const cats = first ? mergeCategories(row.data.categories, S.categories) : row.data.categories;
        S.categories = migrate({ categories: cats }).categories;
        S.budgets = row.data.budgets || {}; S.monthlyBudget = Number(row.data.monthlyBudget) || 0; S.budgetsUpdatedAt = row.data.budgetsUpdatedAt || null;
        if (first) Cloud.known.set('config', ''); // força reenviar a mescla de categorias
        continue;
      }
      if (row.kind === 'tx') {
        const id = row.id.slice(3);
        if (row.deleted) { rmTx.add(id); S.deleted[id] = row.updated_at; }
        else if (validTx(row.data)) {
          rmTx.delete(id); delete S.deleted[id];
          if (txIdx.has(id)) S.transactions[txIdx.get(id)] = row.data; else { txIdx.set(id, S.transactions.length); S.transactions.push(row.data); }
        }
      } else if (row.kind === 'rec') {
        const id = row.id.slice(4);
        if (row.deleted) rmRec.add(id);
        else if (validRec(row.data)) { rmRec.delete(id); if (recIdx.has(id)) S.recurrences[recIdx.get(id)] = row.data; else { recIdx.set(id, S.recurrences.length); S.recurrences.push(row.data); } }

    if (rmRec.size) S.recurrences = S.recurrences.filter(r => !rmRec.has(r.id));
